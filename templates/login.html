<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Secure Mail Console - Login</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body class="login-page">


<div class="login-card">


<div class="login-logo">
    <i class="fa-solid fa-shield-halved"></i>
</div>


<h1>Secure Mail Console</h1>

<p class="login-subtitle">
    Enter your admin password to access the console
</p>


<form method="post" autocomplete="off">

    <label for="password">Password</label>

    <div class="login-password">
        <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter admin password"
            autocomplete="new-password"
            required
            autofocus
        >

        <button type="button" id="showPassword" aria-label="Toggle Password Visibility">
            <i class="fa-regular fa-eye"></i>
        </button>
    </div>


    {% if error %}
    <div class="login-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error }}
    </div>
    {% endif %}


    <button type="submit" class="login-button">
        <i class="fa-solid fa-right-to-bracket"></i>
        Login to Dashboard
    </button>

</form>


<div class="login-footer">
    <i class="fa-solid fa-lock"></i>
    Protected & Encrypted Session
</div>


</div>


<script>
const passwordInput = document.getElementById("password");
const toggleBtn = document.getElementById("showPassword");

toggleBtn.addEventListener("click", function() {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        this.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
    } else {
        passwordInput.type = "password";
        this.innerHTML = '<i class="fa-regular fa-eye"></i>';
    }
});
</script>

</body>
</html>
